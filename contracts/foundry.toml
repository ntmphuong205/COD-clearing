[profile.default]
src = "src"
out = "out"
libs = ["lib", "../node_modules"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=../node_modules/@openzeppelin/"]
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[fuzz]
runs = 256

[rpc_endpoints]
hub = "http://127.0.0.1:8545"
carrierA = "http://127.0.0.1:8546"
carrierB = "http://127.0.0.1:8547"
